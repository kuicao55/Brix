# ============================================================
# Provider & Model Configuration
# ============================================================
# 添加新 provider: 复制模板 → 填 base_url + api_key_env
# 添加新 model:    复制模板 → 填 id + provider
# 默认使用 Anthropic 协议
# ============================================================

providers:
  # --- 聚合平台 ---
  zenmux-anthropic:
    base_url: "https://zenmux.ai/api/anthropic"
    api_key_env: "ZENMUX_API_KEY"
    protocol: "anthropic"

  zenmux-openai:
    base_url: "https://zenmux.ai/api/v1"
    api_key_env: "ZENMUX_API_KEY"
    protocol: "openai"

  # --- 官方 API (Anthropic 协议) ---
  ali:
    base_url: "https://dashscope.aliyuncs.com/apps/anthropic"
    api_key_env: "ALI_API_KEY"
    protocol: "anthropic"

  minimax:
    base_url: "https://api.minimaxi.com/v1"
    api_key_env: "MINIMAX_API_KEY"
    protocol: "openai"

  mimo:
    base_url: "https://api.xiaomimimo.com/anthropic"
    api_key_env: "MIMO_API_KEY"
    protocol: "anthropic"

  # --- DeepSeek 官方 ---
  deepseek:
    base_url: "https://api.deepseek.com"
    api_key_env: "DEEPSEEK_API_KEY"
    protocol: "openai"

models:
  # ============================================================
  # MiniMax — 主力模型，量大管饱
  # ============================================================
  - id: "minimax/MiniMax-M2.7"
    provider: "minimax"
    purpose: ["fast_chat", "coding", "reasoning", "planning"]
    capabilities: ["tool_calling", "strong_reasoning"]
    max_context: 128000
    cost_tier: "low"
    default: true

  # ============================================================
  # Mimo — 编程
  # ============================================================
  - id: "mimo/mimo-v2.5-pro"
    provider: "mimo"
    purpose: ["coding", "reasoning"]
    capabilities: ["tool_calling", "strong_reasoning"]
    max_context: 128000
    cost_tier: "high"

  # ============================================================
  # ZenMux — 通用知识
  # ============================================================
  - id: "zenmux-openai/deepseek/deepseek-v4-pro"
    provider: "zenmux-openai"
    purpose: ["knowledge", "complex_qa", "reasoning"]
    capabilities: ["tool_calling", "strong_reasoning"]
    max_context: 128000
    cost_tier: "low"

  - id: "zenmux-openai/deepseek/deepseek-v4-flash"
    provider: "zenmux-openai"
    purpose: ["fast_chat", "simple_qa"]
    capabilities: ["tool_calling", "low_latency", "low_cost"]
    max_context: 64000
    cost_tier: "low"

  - id: "zenmux-openai/deepseek/deepseek-chat"
    provider: "zenmux-openai"
    purpose: ["fast_chat", "simple_qa"]
    capabilities: ["low_latency", "low_cost"]
    max_context: 64000
    cost_tier: "low"

  # ============================================================
  # ZenMux — 编程
  # ============================================================
  - id: "zenmux-openai/moonshotai/kimi-k2.6"
    provider: "zenmux-openai"
    purpose: ["coding", "reasoning"]
    capabilities: ["tool_calling", "strong_reasoning"]
    max_context: 128000
    cost_tier: "medium"

  - id: "zenmux-openai/z-ai/glm-5.1"
    provider: "zenmux-openai"
    purpose: ["coding", "reasoning"]
    capabilities: ["tool_calling", "strong_reasoning"]
    max_context: 128000
    cost_tier: "high"

  # ============================================================
  # ZenMux — 多模态（图片/视频生成）
  # ============================================================
  - id: "zenmux-openai/openai/gpt-image-2"
    provider: "zenmux-openai"
    purpose: ["image_generation"]
    capabilities: ["image_generation"]
    max_context: 32000
    cost_tier: "high"

  - id: "zenmux-openai/alibaba/happyhorse-1.0"
    provider: "zenmux-openai"
    purpose: ["video_generation"]
    capabilities: ["video_generation"]
    max_context: 32000
    cost_tier: "high"

  # ============================================================
  # ZenMux — intent (intent 分类等轻量任务)
  # ============================================================
  - id: "zenmux-openai/qwen/qwen3.5-flash"
    provider: "zenmux-openai"
    purpose: ["fast_chat", "simple_qa"]
    capabilities: ["low_latency", "low_cost"]
    max_context: 1020000
    cost_tier: "low"

  - id: "zenmux-openai/openai/gpt-5-nano"
    provider: "zenmux-openai"
    purpose: ["fast_chat", "simple_qa"]
    capabilities: ["low_latency", "low_cost"]
    max_context: 128000
    cost_tier: "low"

  # ============================================================
  # ZenMux — OpenAI / Anthropic (备用)
  # ============================================================
  - id: "zenmux-openai/openai/gpt-4.1-mini"
    provider: "zenmux-openai"
    purpose: ["fast_chat", "simple_qa"]
    capabilities: ["low_latency", "low_cost", "tool_calling"]
    max_context: 128000
    cost_tier: "low"

  - id: "zenmux-openai/openai/gpt-4.1"
    provider: "zenmux-openai"
    purpose: ["coding", "reasoning", "planning"]
    capabilities: ["strong_reasoning", "tool_calling", "long_context"]
    max_context: 128000
    cost_tier: "high"

  - id: "zenmux-openai/google/gemini-3.1-pro-preview"
    provider: "zenmux-openai"
    purpose: ["fast_chat", "coding", "reasoning"]
    capabilities: ["tool_calling", "long_context"]
    max_context: 1000000
    cost_tier: "low"

  - id: "zenmux-anthropic/anthropic/claude-sonnet-4-20250514"
    provider: "zenmux-anthropic"
    purpose: ["analysis", "coding", "planning"]
    capabilities: ["strong_reasoning", "tool_calling", "long_context"]
    max_context: 200000
    cost_tier: "high"

  # ============================================================
  # DeepSeek 官方
  # ============================================================
  - id: "deepseek/deepseek-v4-flash"
    provider: "deepseek"
    purpose: ["fast_chat", "simple_qa"]
    capabilities: ["tool_calling", "low_latency", "low_cost"]
    max_context: 64000
    cost_tier: "low"

  - id: "deepseek/deepseek-v4-pro"
    provider: "deepseek"
    purpose: ["coding", "reasoning", "planning"]
    capabilities: ["tool_calling", "strong_reasoning"]
    max_context: 128000
    cost_tier: "low"

  # ============================================================
  # 阿里云 — Qwen (intent 分类等轻量任务)
  # ============================================================
  - id: "ali/qwen3.6-flash"
    provider: "ali"
    purpose: ["fast_chat", "simple_qa"]
    capabilities: ["low_latency", "low_cost"]
    max_context: 64000
    cost_tier: "low"

  # 添加新 model 模板:
  # - id: "provider-name/model-name"
  #   provider: "provider-name"
  #   purpose: ["fast_chat"]
  #   capabilities: ["tool_calling"]
  #   max_context: 128000
  #   cost_tier: "low"

engine: "state_machine"

routing:
  default_model: "zenmux-openai/deepseek/deepseek-v4-flash"
  fallback_model: "minimax/MiniMax-M2.7"

# ============================================================
# Side 层 — 辅助任务配置（完全可选）
# ============================================================
side:
  enabled: true
  model: "zenmux-openai/qwen/qwen3.5-flash"           # side 任务专用小模型

  tasks:
    session_title:
      enabled: true
    tool_summary:
      enabled: true
    history_search:
      enabled: true
      top_k: 3
      trigger_keywords:
        - "之前"
        - "上次"
        - "记得"
        - "曾经"
        - "以前"
        - "previously"
        - "last time"
        - "remember"
    context_compress:
      enabled: true
      message_threshold: 50
    session_summary:
      enabled: true
      idle_threshold_minutes: 5
    memory_summary:
      enabled: true
    dream:
      enabled: true

retry:
  max_retries: 3
  base_delay: 1.0
  max_delay: 30.0

memory:
  data_dir: "memory/data"
  max_context_tokens: 8000

# ============================================================
# 语音模块配置
# ============================================================
voice:
  enabled: true  # 通过 /voice 命令动态开启，或改为 true 默认开启
  input_enabled: true    # 语音输入（STT）
  output_enabled: true   # 语音输出（TTS）

  # STT (语音识别)
  stt_provider: "online"       # local = faster-whisper 本地模型 / online = Qwen-ASR 线上模型

  # 本地 STT (faster-whisper) — 首次使用自动下载
  stt_model: "small"          # tiny/base/small/medium/large-v3
  stt_language: "zh"
  stt_device: "cpu"           # cpu/cuda
  stt_compute_type: "int8"    # int8/float16/float32

  # 在线 STT (Qwen-ASR Realtime) — 通过 WebSocket 连接阿里云
  stt_online_model: "qwen3-asr-flash-realtime"
  stt_online_language: "zh"
  stt_online_api_key_env: "ALI_API_KEY"  # 复用阿里云 API Key

  # TTS (语音合成) — 阿里云 CosyVoice v3 Flash
  tts_model: "cosyvoice-v3-flash"
  tts_voice: "loongeric_v3"   # v3 音色（longxiaochun 是 v2 音色，不兼容 v3 模型）
  tts_api_key_env: "ALI_API_KEY"  # 复用阿里云 API Key
  tts_sample_rate: 24000
  tts_cooldown_ms: 800  # TTS 播放后冷却时间（ms），防止回声循环

  # VAD (语音活动检测)
  vad_threshold: 0.5

  # 唤醒词
  wake_word_model: "hey_brix"
  wake_threshold: 0.5

  # 连续对话
  continuous_idle_timeout: 10  # 秒

  # LLM 文本清理（原 VoiceCleanupTask 逻辑迁移为可插拔 LLMCleanupProcessor）
  cleanup_enabled: false
  cleanup_model: ""
  cleanup_timeout: 0.8
  cleanup_min_length: 10
