[project]
name = "brix"
version = "0.1.0"
description = "Personal AI Agent"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
    "prompt-toolkit>=3.0",
    "anthropic>=0.40",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "tiktoken>=0.7",
    "tenacity>=8.0",
]

[project.optional-dependencies]
voice = [
    "silero-vad>=5.0",
    "faster-whisper>=1.0",
    "openwakeword>=0.6",
    "pyaudio>=0.2.14",
    "websockets>=12.0",
    "numpy>=1.24,<2",
    "scipy>=1.11",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
